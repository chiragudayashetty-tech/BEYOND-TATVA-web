<style>
  .m0-hero { padding: 50px 0 30px; text-align: center; }
  .m0-hero .bot { margin: 0 auto 20px; }
  .m0-hero h1 { font-size: clamp(48px, 10vw, 110px); margin: 14px 0 12px; }
  html[lang="kn"] .m0-hero h1 { font-size: clamp(34px, 7vw, 64px); }
  .m0-hero p { color: var(--paper-2); font-size: 18px; }
  .track { display: flex; justify-content: center; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
  .track span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13.5px; font-weight: 800; color: var(--muted); transition: all .4s var(--ease); }
  .track span i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; background: rgba(243,234,219,.08); }
  .track span.on { color: var(--paper); border-color: var(--gold); background: rgba(246,196,83,.1); }
  .track span.on i { background: var(--gold); color: var(--ink); }
  .step { max-width: 920px; margin: 0 auto; padding: 50px 0; }
  .step h2 { font-size: clamp(34px, 5.6vw, 58px); margin-bottom: 10px; }
  html[lang="kn"] .step h2 { font-size: clamp(26px, 4.4vw, 40px); }
  .step > p { color: var(--paper-2); font-size: 17px; margin-bottom: 22px; }
  .facts { display: grid; gap: 14px; }
  .fact { padding: 22px; }
  .fact .em { font-size: 34px; }
  .fact h3 { font-size: 26px; margin: 10px 0 6px; }
  html[lang="kn"] .fact h3 { font-size: 19px; }
  .fact p { color: var(--paper-2); font-size: 15.5px; }
  @media (min-width: 760px) { .facts { grid-template-columns: repeat(3, 1fr); } }
  .rules { display: grid; gap: 14px; }
  .rule { height: 230px; perspective: 1100px; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
  .rule .inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .8s var(--ease); transform-style: preserve-3d; }
  .rule[aria-pressed="true"] .inner { transform: rotateY(180deg); }
  .rule .face { padding: 24px; border-radius: var(--r); justify-content: space-between; }
  .rule .front { background: linear-gradient(160deg, rgba(246,196,83,.2), rgba(19,17,27,.92)); border: 1px solid rgba(246,196,83,.4); }
  .rule .back { background: linear-gradient(160deg, rgba(44,198,181,.2), rgba(19,17,27,.92)); border: 1px solid rgba(44,198,181,.45); }
  .rule .num { font-family: var(--serif); font-size: 64px; line-height: .8; color: var(--gold); }
  .rule .front p { font-family: var(--serif); font-size: 28px; line-height: 1.1; color: var(--paper); }
  html[lang="kn"] .rule .front p { font-family: var(--kn); font-weight: 700; font-size: 20px; line-height: 1.5; }
  .rule .back p { font-size: 15.5px; font-weight: 600; }
  @media (min-width: 760px) { .rules { grid-template-columns: repeat(3, 1fr); } }
  .builder { display: grid; gap: 20px; }
  .bgroup b { display: block; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  html[lang="kn"] .bgroup b { letter-spacing: .02em; font-size: 14px; }
  .bgroup .opts { gap: 8px; }
  .bgroup .opt { animation: none; }
  .preview { padding: 22px; border-color: rgba(246,196,83,.35); }
  .preview small { font-size: 12px; font-weight: 900; letter-spacing: .16em; color: var(--gold-2); }
  .preview p { margin-top: 10px; font-size: 16.5px; line-height: 1.65; }
  .preview mark { background: rgba(246,196,83,.2); color: var(--gold-2); border-radius: 6px; padding: 0 4px; }
  .preview .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  @media (min-width: 860px) { .builder { grid-template-columns: 1fr 1fr; align-items: start; } }
  .mcq { padding: 22px; margin-bottom: 14px; }
  .mcq h3 { font-family: var(--sans); font-weight: 800; font-size: 18px; letter-spacing: 0; line-height: 1.4; margin-bottom: 12px; }
  .done-btn { margin-top: 18px; }
  .finish { max-width: 720px; margin: 20px auto 80px; padding: 34px 26px; text-align: center; }
  .finish h2 { font-size: clamp(38px, 6vw, 64px); }
  html[lang="kn"] .finish h2 { font-size: clamp(28px, 4.6vw, 42px); }
  .finish p { color: var(--paper-2); margin-top: 10px; font-size: 17px; }
  .cert-mini { margin: 24px auto; max-width: 420px; padding: 22px; border-radius: 20px; background: #FBF4E6; color: #3A2604; border: 6px double #C9A04A; }
  .cert-mini small { letter-spacing: .25em; font-weight: 900; font-size: 11px; }
  .cert-mini b { display: block; font-family: var(--serif); font-weight: 400; font-size: 34px; margin: 6px 0; }
  .cert-mini span { font-size: 13px; }
  .finish .row { display: grid; gap: 10px; margin-top: 18px; }
  @media (min-width: 560px) { .finish .row { grid-template-columns: 1fr 1fr; } }
  .lock { max-width: 560px; margin: 70px auto; padding: 40px 26px; text-align: center; }
  .lock .bot { margin: 0 auto 18px; }
  .lock h1 { font-size: clamp(40px, 7vw, 64px); }
  html[lang="kn"] .lock h1 { font-size: clamp(28px, 5vw, 40px); }
  .lock p { color: var(--paper-2); margin: 12px 0 22px; font-size: 17px; }
  .back-home { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; color: var(--paper-2); text-decoration: none; }
